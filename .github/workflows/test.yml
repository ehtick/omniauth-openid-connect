name: "Test suite"
on:
  push:
    branches:
      - dev
      - release/*
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - '3.2'
          - '3.4'
          - '4.0'
    steps:
    - uses: actions/checkout@v3
    - name: Setup ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - name: test
      run: |
        bundle exec rake test
